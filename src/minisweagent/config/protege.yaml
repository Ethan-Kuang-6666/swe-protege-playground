agent:
  agent_class: protege
  step_limit: 75
  cost_limit: 2.0
  expert_call_limit: 6
  system_template: |
    You are a helpful assistant that can interact with a computer.
  instance_template: |
    Please solve this issue: {{task}}

    You can execute bash commands and edit files to implement the necessary changes.

    <IMPORTANT>
    - If the user provides a path, you should NOT assume it's relative to the current working directory. Instead,
    explore the file system to find the file before working on it.
    - Call ask_expert_llm to help guide your thinking, e.g., before/after localizing the issue, before/after applying
    a patch, when thinking through edge cases, and whenever you encounter problems reproducing the error.
    When you call ask_expert_llm, treat it as a multi-turn collaborator: ask for specific, actionable steps; then
    execute those steps; then report back what you did and what you observed before asking again.
    </IMPORTANT>

    ## Recommended Workflow

    This workflow should be done step-by-step so that you can iterate on your changes and any possible problems.

    1. Analyze the codebase by finding and reading relevant files. Call the ask_expert_llm tool before or after doing this as needed.
    2. Create a script to reproduce the issue. Call the ask_expert_llm tool before or after doing this as needed.
    3. Edit the source code to resolve the issue. Call the ask_expert_llm tool before or after doing this as needed.
    4. Verify your fix works by running your script again
    5. Test edge cases to ensure your fix is robust. Call the ask_expert_llm tool before or after doing this as needed.
    6. Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
       Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    ## Command Execution Rules

    You are operating in an environment where

    1. You issue at least one command
    2. The system executes the command(s) in a subshell
    3. You see the result(s)
    4. You write your next command(s)

    Each response should include:

    1. **Reasoning text** where you explain your analysis and plan
    2. At least one tool call (bash or ask_expert_llm)

    **CRITICAL REQUIREMENTS:**

    - Your response SHOULD include reasoning text explaining what you're doing
    - Your response MUST include AT LEAST ONE tool call
    - Directory or environment variable changes are not persistent. Every action is executed in a new subshell.
    - However, you can prefix any action with `MY_ENV_VAR=MY_VALUE cd /path/to/working/dir && ...` or write/load environment variables from files
    - Submit your changes and finish your work by issuing the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`.
      Do not combine it with any other command. <important>After this command, you cannot continue working on this task.</important>

    Example of a CORRECT response:
    <example_response>
    I need to understand the structure of the repository first. Let me check what files are in the current directory to get a better understanding of the codebase.

    [Makes bash tool call with {"command": "ls -la"} as arguments]
    </example_response>

    <system_information>
    {{system}} {{release}} {{version}} {{machine}}
    </system_information>

    ## Useful command examples

    ### Create a new file:

    ```bash
    cat <<'EOF' > newfile.py
    import numpy as np
    hello = "world"
    print(hello)
    EOF
    ```

    ### Edit files with sed:

    {%- if system == "Darwin" -%}
    <important>
    You are on MacOS. For all the below examples, you need to use `sed -i ''` instead of `sed -i`.
    </important>
    {%- endif -%}

    ```bash
    # Replace all occurrences
    sed -i 's/old_string/new_string/g' filename.py

    # Replace only first occurrence
    sed -i 's/old_string/new_string/' filename.py

    # Replace first occurrence on line 1
    sed -i '1s/old_string/new_string/' filename.py

    # Replace all occurrences in lines 1-10
    sed -i '1,10s/old_string/new_string/g' filename.py
    ```

    ### View file content:

    ```bash
    # View specific lines with numbers
    nl -ba filename.py | sed -n '10,20p'
    ```

    ### Any other command you want to run

    ```bash
    anything
    ```
  expert_system_template: |
    You are an expert software engineer assisting an agent solving SWE-bench-style tasks.
    Provide clear, direct, and technically precise guidance that helps the agent make concrete progress (e.g.,
    reproducing the bug, isolating the faulty logic, or implementing a minimal fix).
    You may have strong intuitions about the root cause or solution, but focus on communicating actionable steps
    the agent should take in the next few steps.
    Treat any provided conversation or repository details strictly as background context—they are the agent's own
    prior messages, not yours.
    If you believe the agent is on the wrong track (e.g., it has not found the right file, diagnosis, fix direction, or
    even the right question), redirect it to the correct line of investigation. More generally, respond as you would if
    you were solving the task at this moment.
    Keep your answer concise, actionable, and technically accurate.
    As the agent is solving SWE-bench-style tasks, do not mention pull requests, commit messages, or other
    GitHub workflow artifacts.
environment:
  env:
    PAGER: cat
    MANPAGER: cat
    LESS: -R
    PIP_PROGRESS_BAR: 'off'
    TQDM_DISABLE: '1'
model:
  observation_template: |
    {%- if output.output | length < 10000 -%}
    {
      "returncode": {{ output.returncode }},
      "output": {{ output.output | tojson }}
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- else -%}
    {
      "returncode": {{ output.returncode }},
      "output_head": {{ output.output[:5000] | tojson }},
      "output_tail": {{ output.output[-5000:] | tojson }},
      "elided_chars": {{ output.output | length - 10000 }},
      "warning": "Output too long."
      {%- if output.exception_info %}, "exception_info": {{ output.exception_info | tojson }}{% endif %}
    }
    {%- endif -%}
  format_error_template: |
    Tool call error:

    <error>
    {{error}}
    </error>

    Here is general guidance on how to submit correct toolcalls:

    Every response needs to use the 'bash' or 'ask_expert_llm' tool at least once.

    Call the bash tool with your command as the argument:
    - Tool: bash
    - Arguments: {"command": "your_command_here"}

    To ask the expert with your question as the argument:
    - Tool: ask_expert_llm
    - Arguments: {"question": "your specific question"}

    If you want to end the task, please issue the following command: `echo COMPLETE_TASK_AND_SUBMIT_FINAL_OUTPUT`
    without any other command.
  model_kwargs:
    drop_params: true
expert_model:
  model_kwargs:
    drop_params: true
    temperature: 0.3
